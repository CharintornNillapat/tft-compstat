guide: |
  **Early:** Play the cheap Blackthorn units (Rek'Sai, Veigar, Warwick) and put AP items on whoever holds them best until Zyra and Soraka show up.

  **Mid:** This board is expensive. Roll hard at 4-2 for Malphite, Soraka and Zyra. The Flora Fatalis emblem is close to essential.

  **Late:** Selling a 3-cost to Flora Fatalis makes Malphite stronger. Keep Malphite alive, since the backline scales off him.

  **Positioning:** Malphite in the middle of the front row. Soraka and Zyra share a back corner, and Azir takes the other side.
