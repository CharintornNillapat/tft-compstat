guide: |
  **Early:** Play the strongest AD opener you're offered and slam Guinsoo's Rageblade early. Draven needs it, so keep it for him. Sivir, Nidalee or Aphelios can hold the AD items through stage 3.

  **Mid:** Push levels and take losses in stage 4 if you have to. The goal is level 9 by 5-2. Levels 8 to 10 cost 4 gold less in 18.2, which is why this line is strong now.

  **Late:** At 9, roll for Draven and the 5-cost frontline (Maokai, Taric, Gnar, Kennen, Ivern). A Vanguard Emblem turns on Vanguard with Taric; Executioner is the next best emblem.

  **Positioning:** Draven in a back corner, with Ezreal beside him. Maokai tanks in the middle of the front row.

  Missing level 9 usually means a bottom-4 finish. If you're low on HP in stage 4, stabilise at 8 instead.
