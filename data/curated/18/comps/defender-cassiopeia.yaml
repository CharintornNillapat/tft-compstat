guide: |
  **Early:** Play Coven from the opener (Camille, Elise, Caitlyn), or commit when an early Cassiopeia shows up.

  **Mid:** Slow roll at level 7 for 3-star Cassiopeia and Rammus. Cassiopeia wants Hextech Gunblade, then Rabadon's Deathcap or Archangel's Staff, then Spear of Shojin or Blue Buff. With the Defender Emblem, the emblem takes one of those slots.

  **Late:** Level to 8 for Soraka to complete Flora Fatalis, and Lillia to reach 4 Defenders.

  **Positioning:** Fiddlesticks goes on the outside edge with Rammus next to him, so the enemy's aggro bounces between them.
