guide: |
  **Early:** Three Blossom units make one of the strongest openers in the set, and the wisps they grow are worth a lot. Karma, Yorick and Yunara are the usual starters.

  **Mid:** This line often comes from an Invoker Morgana or Sivir board. Keep your economy and level on curve. Ahri holds the AP items until Ashe arrives.

  **Late:** Hit level 9 and find Ashe so you don't stall at 8. Ashe needs a mana item (Spear of Shojin or Blue Buff). Swap the 1-cost Blossoms for Lux (Blossom) or Master Yi to keep Blossom 5 as you upgrade.

  **Positioning:** Ashe and Ahri share a back corner. Maokai and Taric hold the middle of the front row, with Brawlers on the flanks.
