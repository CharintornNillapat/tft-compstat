# Stage-2 opener boards and the items worth slamming on them.
# Derived from MetaTFT DIAMOND+ early unit clusters for Set 18 Patch 18.2.
#
# Like meta-notes.yaml this file is read at build time and ships inside the
# deployment, so a change needs a redeploy, not `pnpm seed:curated`.
# Every unit, item, and pivot comp slug is validated during build.
patch: "18.2"
title: Early openers & item slams
openers:
  - name: Blossom Invokers
    tier: S
    core_units: [DA_Karma18, DA_18_Yorick, DA_18_Yunara, DA_18_Rakan]
    slammable_items: [DA_ArchangelsStaff, DA_SunfireCape, DA_WarmogsArmor]
    transition_to: [invoker-ahri, blossom-sett-ashe, ashe-fast-9]
    notes: Karma holds AP items while Yorick tanks. Win streak into Fast 9 or slow-roll Blossom.

  - name: Elderwood Vanguard
    tier: S
    core_units: [DA_18_Ornn, DA_18_Alistar, DA_18_Varus, DA_18_Xayah]
    slammable_items: [DA_GuinsoosRageblade, DA_SunfireCape, DA_SteadfastHeart]
    transition_to: [elderwood-ezreal-draven, elderwood-aphelios-ezreal, vanguard-aphelios]
    notes: Xayah carries AD items with Ornn/Alistar frontline. Push level 5 at 2-5 on streaks.

  - name: Riftbeast Swarm
    tier: S
    core_units: [DA_18_Sentry, DA_Cinderling18, DA_Scuttlecrab18, DA_18_Yorick]
    slammable_items: [DA_ArchangelsStaff, DA_GargoyleStoneplate, DA_WarmogsArmor]
    transition_to: [riftbeast-pebbles, riftbeast-malphite]
    notes: Roll for 3-star Pebbles and Cinderling early, then push levels for Elder Dragon.

  - name: Sprykin Brawlers
    tier: A
    core_units: [DA_18_Kobuko, DA_18_RekSai, DA_18_Teemo, DA_18_Veigar]
    slammable_items: [DA_BlueBuff, DA_TitansResolve, DA_SunfireCape]
    transition_to: [sprykin-veigar, sprykin-teemo, executioner-malphite]
    notes: Rek'Sai holds tank items while Veigar scales with AP. Slow roll at level 5 or 6.

  - name: Defender Snipers
    tier: A
    core_units: [DA_18_Camille, DA_18_Caitlyn, DA_18_Elise, DA_18_Rakan]
    slammable_items: [DA_KrakensFury, DA_Bloodthirster, DA_BrambleVest]
    transition_to: [defender-cassiopeia, juggernaut-caitlyn, invoker-morgana-taric]
    notes: Caitlyn provides high early single-target damage. Transition into Cassiopeia carry.

  - name: Elderwood Defenders
    tier: A
    core_units: [DA_18_Ornn, DA_18_Kayle, DA_18_Leona, DA_18_Xayah]
    slammable_items: [DA_GuinsoosRageblade, DA_GargoyleStoneplate, DA_SunfireCape]
    transition_to: [elderwood-kayle, defender-cassiopeia]
    notes: Kayle holds attack speed items behind Defender frontline. Stable mid-game pivot.

  - name: Inferno Hunters
    tier: B
    core_units: [DA_18_Varus, DA_18_Akali_AD, DA_18_Shen, DA_18_Ornn]
    slammable_items: [DA_GuinsoosRageblade, DA_RedBuff, DA_BrambleVest]
    transition_to: [hunter-sivir, inferno-akali]
    notes: Akali and Varus contest tempo early. Pivot into 4-cost Sivir or Akali carry.

  - name: Lunar Rapidfire
    tier: B
    core_units: [DA_18_Alistar, DA_18_Ornn, DA_18_Varus, DA_18_Shen]
    slammable_items: [DA_LastWhisper, DA_Deathblade, DA_ProtectorsVow]
    transition_to: [lunar-aphelios-nidalee, rapidfire-aphelios]
    notes: Stall with tank frontline while AD backline chips away. Great for Aphelios pivots.
