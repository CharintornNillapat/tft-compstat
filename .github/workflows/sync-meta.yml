# Daily MetaTFT → data/curated sync (README "Tier lists and comps from the live meta").
#
# Runs `pnpm sync:meta --seed` (tier lists + comps, then seed:curated into Supabase) and
# `pnpm sync:bis` (champion-bis.yaml), then commits whatever changed under data/curated/
# straight to main. That push is what redeploys Vercel, which is how the build-time
# files (champion-bis.yaml) reach the site.

name: Sync meta and BIS

on:
  schedule:
    # 03:00 UTC = 10:00 Asia/Bangkok. Ahead of the Vercel Riot cron (04:17 UTC).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let a manual run and the scheduled run race each other to push.
concurrency:
  group: sync-meta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read by src/lib/env.ts (supabaseAdminEnv): scripts/lib/references.ts and seed-curated.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Read by scripts/lib/revalidate.ts after the seed. Unset SITE_URL = skip with a warning.
      SITE_URL: ${{ secrets.SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      # @supabase/supabase-js requires Node >= 22; 24 matches local development.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # package.json already wraps both in `tsx --conditions=react-server
      # --env-file-if-exists=.env.local`; there is no .env.local here, so env comes from above.
      - name: Sync tier lists and comps, then seed
        run: pnpm sync:meta --seed

      - name: Sync best-in-slot builds
        run: pnpm sync:bis

      - name: Commit and push data/curated changes
        run: |
          git add data/curated
          if git diff --cached --quiet; then
            echo "data/curated is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(auto): daily meta and bis sync"
          # Pick up anything pushed to main while the sync ran.
          git pull --rebase origin main
          git push origin HEAD:main
