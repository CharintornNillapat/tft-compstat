# Daily MetaTFT → data/curated sync (README "Tier lists and comps from the live meta").
#
# Runs `pnpm sync:static` (CommunityDragon → the champions/traits/items tables every step
# below validates against), then `pnpm sync:meta --seed` (tier lists + comps, then
# seed:curated into Supabase, plus augment-tiers.yaml), `pnpm sync:bis`
# (champion-bis.yaml), and `pnpm sync:openers` (openers.yaml).
# If that changed anything under data/curated/, `pnpm build` must pass against the new files
# before they are committed — a generated file the site can't prerender fails the job instead
# of landing on main. The push that follows is what redeploys Vercel, which is how the build-time
# files (augment-tiers.yaml, champion-bis.yaml, openers.yaml) reach the site.
#
# Note: `sync:meta --seed` writes tier lists and comps straight to Supabase and revalidates the
# live site *before* this build gate runs, so a failure here stops a bad commit from landing on
# main but does not undo that live write. Openers are derived directly from the current active comps
# and validated before writing.

name: Sync static, meta, BIS, and openers

on:
  schedule:
    # 03:00 UTC = 10:00 Asia/Bangkok. Ahead of the Vercel Riot cron (04:17 UTC).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let a manual run and the scheduled run race each other to push.
concurrency:
  group: sync-meta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read by src/lib/env.ts (supabaseAdminEnv): scripts/lib/references.ts and seed-curated.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Read by supabasePublicEnv(): the anon client the build-time prerender uses to read
      # the tables the changed files feed into (architecture §8). Only needed by the build
      # gate below, but declaring it once here is simplest.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Read by scripts/lib/revalidate.ts after the seed. Unset SITE_URL = skip with a warning.
      SITE_URL: ${{ secrets.SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      # @supabase/supabase-js requires Node >= 22; 24 matches local development.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Static game data first: everything below resolves `api_name`s against the
      # champions/traits/items tables, and a patch that adds a unit or an item would
      # otherwise be skipped by sync:meta as an unknown name and silently dropped from
      # the tier lists and /bis until someone ran this by hand.
      #
      # `--allow-set-rollover` is deliberately NOT passed: a new set has no curated
      # folder yet, so flipping `is_active` unattended would prerender an empty site.
      # The script fails the job instead, which is the alarm for a set rollover.
      - name: Sync static game data
        run: pnpm sync:static

      # package.json already wraps both in `tsx --conditions=react-server
      # --env-file-if-exists=.env.local`; there is no .env.local here, so env comes from above.
      - name: Sync tier lists and comps, then seed
        run: pnpm sync:meta --seed

      - name: Sync best-in-slot builds
        run: pnpm sync:bis

      - name: Sync stage-2 openers
        run: pnpm sync:openers

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/curated; then
            echo "data/curated is unchanged; nothing to build or commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Gate the commit on a real build, not just the generators' own schema checks — those
      # validate each file in isolation and don't know about openers.yaml's pivots or anything
      # else the site resolves at prerender time.
      - name: Build against the changed files
        if: steps.diff.outputs.changed == 'true'
        run: pnpm build

      - name: Commit and push data/curated changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add data/curated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(auto): daily meta, bis, and openers sync"
          # Pick up anything pushed to main while the sync ran.
          git pull --rebase origin main
          git push origin HEAD:main
